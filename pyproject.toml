[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-schema-diff"
version = "0.1.0"
description = "Semantic JSON schema migration and backward-compatibility checker for tool versions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-schema-diff = "mcp_schema_diff.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_schema_diff*"]
